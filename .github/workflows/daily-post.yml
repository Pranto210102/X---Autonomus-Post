name: Daily Autonomous X Post

on:
  schedule:
    # Trigger at 15:30 UTC every day, which is 9:30 PM in Bangladesh (UTC+6)
    - cron: '30 15 * * *'
  # Allows manual triggering from the GitHub UI for testing
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers & Linux System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Execute Autonomous Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_AUTH_STATE: ${{ secrets.X_AUTH_STATE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          NOTIFICATION_RECIPIENT: ${{ secrets.NOTIFICATION_RECIPIENT }}
        run: node agent.js